# OPTIONAL drop-in: lets the agent read Intel GPU utilisation (i915 performance counters).
# Without it the Intel GPU clock speed is still reported; only the utilisation % is unavailable.
#
#   sudo mkdir -p /etc/systemd/system/hcluster-agent.service.d
#   sudo cp agent/systemd/gpu-intel.conf /etc/systemd/system/hcluster-agent.service.d/gpu.conf
#   sudo systemctl daemon-reload && sudo systemctl restart hcluster-agent
#
# What this grants: CAP_PERFMON (read-only access to hardware performance counters) and the perf_event_open
# system call. Nothing else is loosened. Remove the drop-in file to revoke.
#
# NVIDIA nodes need a different change: /dev/nvidia* is hidden by PrivateDevices=yes. Add `PrivateDevices=no`
# (and keep everything else) in a drop-in, then confirm with `sudo hcluster-agent discover`. UNTESTED on real hardware.
[Service]
AmbientCapabilities=CAP_PERFMON
CapabilityBoundingSet=CAP_PERFMON
SystemCallFilter=perf_event_open
