# hCluster Sentinel agent configuration  (install path: /etc/hcluster-agent/config.yaml)
#
# NO SECRETS IN THIS FILE. The node API token lives in /etc/hcluster-agent/agent.env
# as HCLUSTER_TOKEN=... (mode 0640 root:hcluster) and is loaded by systemd.

node:
  id: "00000000-0000-0000-0000-000000000000"   # REQUIRED: the Node ID (UUID) shown in the dashboard when you add the node

api:
  url: "https://YOUR-PROJECT.vercel.app"        # REQUIRED: https only (http allowed solely for localhost development)
  timeout_seconds: 10
  max_queue: 720                                # reports kept while offline (720 ≈ 12 h at 60 s); oldest dropped first

intervals:
  heartbeat_seconds: 60     # max time between reports (a report is also sent when metrics/service intervals elapse)
  metrics_seconds: 60       # Prometheus + local metrics collection, independent of heartbeat

log_level: INFO
state_dir: /var/lib/hcluster-agent             # holds the offline backlog queue

# ---------------------------------------------------------------------------
# Prometheus (OPTIONAL). If it is down the agent keeps running and reports "degraded".
# Run `hcluster-agent discover` on the node to verify the URL, targets and metric names.
# ---------------------------------------------------------------------------
prometheus:
  enabled: true
  base_url: "http://127.0.0.1:9091"   # VERIFY: your container maps host 9091 -> container 9090. `discover` probes this.
  timeout_seconds: 5
  collect_targets: true               # also report targets up/total (Prometheus target availability)
  # Extra label matchers injected where $SEL appears, e.g.  instance="h1:9100"   or   instance=~"h1.*"
  # Leave empty when Prometheus scrapes only this node. REQUIRED when a central Prometheus scrapes several nodes.
  selector: ""
  # Allowlist of queries. name -> PromQL expression returning ONE value (use reduce if it can return several).
  # These are STANDARD node_exporter metric names, shipped as templates. If an exporter/metric does not exist,
  # the query returns nothing and the metric is reported as UNAVAILABLE (never estimated).
  queries:
    - { name: cpu_percent,           expr: '100 - (avg(rate(node_cpu_seconds_total{mode="idle",$SEL}[2m])) * 100)' }
    - { name: mem_percent,           expr: '100 * (1 - node_memory_MemAvailable_bytes{$SEL} / node_memory_MemTotal_bytes{$SEL})' }
    - { name: mem_available_bytes,   expr: 'node_memory_MemAvailable_bytes{$SEL}' }
    - { name: mem_total_bytes,       expr: 'node_memory_MemTotal_bytes{$SEL}' }
    # EVERY real drive: one series per mountpoint (label_by). Bind mounts/overlay/tmpfs/boot/docker dirs are filtered out.
    # If node_exporter runs in Docker with --path.rootfs, your drives may appear under a prefix: check `discover`.
    - { name: disk_percent,         label_by: mountpoint, expr: '100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs|vfat",mountpoint!~"/boot.*|/var/lib/docker.*|/var/lib/containers.*|/run.*|/snap.*|/sys.*|/proc.*|/dev.*",$SEL} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs|vfat",mountpoint!~"/boot.*|/var/lib/docker.*|/var/lib/containers.*|/run.*|/snap.*|/sys.*|/proc.*|/dev.*",$SEL})' }
    - { name: disk_available_bytes, label_by: mountpoint, expr: 'node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs|vfat",mountpoint!~"/boot.*|/var/lib/docker.*|/var/lib/containers.*|/run.*|/snap.*|/sys.*|/proc.*|/dev.*",$SEL}' }
    - { name: disk_total_bytes,     label_by: mountpoint, expr: 'node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs|vfat",mountpoint!~"/boot.*|/var/lib/docker.*|/var/lib/containers.*|/run.*|/snap.*|/sys.*|/proc.*|/dev.*",$SEL}' }
    # CPU package temperature (needs node_exporter's hwmon collector; chip names vary: see `discover`).
    - { name: cpu_temp_celsius,     expr: 'max(node_hwmon_temp_celsius{chip=~".*coretemp.*|.*k10temp.*|.*cpu_thermal.*",$SEL})' }
    - { name: load1,                 expr: 'node_load1{$SEL}' }
    - { name: load5,                 expr: 'node_load5{$SEL}' }
    # Network: per physical NIC (label = device) AND the combined total (sum_total). Virtual NICs are excluded by the regex.
    - { name: net_rx_bytes_per_sec, expr: 'sum(rate(node_network_receive_bytes_total{device!~"lo|docker.*|veth.*|br-.*|virbr.*|tailscale.*",$SEL}[2m]))' }
    - { name: net_tx_bytes_per_sec, expr: 'sum(rate(node_network_transmit_bytes_total{device!~"lo|docker.*|veth.*|br-.*|virbr.*|tailscale.*",$SEL}[2m]))' }
    # Example (only if cAdvisor is installed; verify with `discover`):
    # - { name: containers_cpu_cores, expr: 'sum(rate(container_cpu_usage_seconds_total{name!=""}[2m]))' }
    # - { name: containers_mem_bytes, expr: 'sum(container_memory_working_set_bytes{name!=""})' }

# Local /proc metrics: used ONLY for metrics Prometheus can't provide (or when Prometheus is disabled).
local_metrics:
  fallback: true
  # Drives: auto-detects every real mounted drive (ext4/xfs/btrfs/zfs/ntfs/...). To pin an explicit list instead:
  # disk_mountpoints: ["/", "/mnt/media"]
  # disk_exclude_prefixes: ["/boot", "/var/lib/docker", "/snap"]     # default list shown; mounts under these are skipped
  # Network: ONE overall throughput metric (all NICs except these prefixes, summed). Set net_per_interface: true
  # to also report each NIC separately.
  # net_per_interface: false
  net_exclude_prefixes: [lo, docker, veth, br-, virbr, tailscale]
  # GPU: utilisation, clock speed and VRAM are auto-detected (NVIDIA / AMD / Intel) and skipped if there is no GPU.
  # gpu: true

# ---------------------------------------------------------------------------
# Service checks: list ONLY what runs on THIS node. Every node has its own list;
# services appear in the dashboard automatically under the node that reports them.
# No credentials are needed or supported.
#   1. Run `sudo hcluster-agent discover` to see listening ports and probe common services.
#   2. Add an entry per service, then `sudo systemctl restart hcluster-agent`.
# See config.h1.example.yaml for a worked example (Jellyfin/Immich/Pi-hole/Syncthing/Samba).
# Removing an entry stops its checks; delete the stale row from the node page in the dashboard.
# ---------------------------------------------------------------------------
services: []
  # - key: myservice             # stable id: lowercase letters, digits, - _ .
  #   name: My service
  #   type: http                 # http | tcp
  #   url: "http://127.0.0.1:8080/health"
  #   expected_status: "200-399" # int, "200-299", or a list
  #   # expect_body_contains: "ok"
  #   timeout_seconds: 5
  #   interval_seconds: 60
  #   degraded_after_ms: 3000    # slower => DEGRADED (null disables)
  #   retries: 1
  #   # verify_tls: false        # self-signed https
  #   # report_target: false     # don't send the URL/host to the dashboard
  #
  # - key: fileshare
  #   name: File share
  #   type: tcp
  #   host: 127.0.0.1
  #   port: 445
